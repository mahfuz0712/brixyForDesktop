[project]
name = "brixyfordesktop"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.1",
    "pillow>=12.3.0",
    "pvporcupine>=4.0.3",
    "pystray>=0.19.5",
    "python-dotenv>=1.2.2",
    "sounddevice>=0.5.5",
]


[project.scripts]
brixy = "brixy.main:run"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "brixy"
