[project]
name = "brixy-desktop"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=5.0.1",
    "dotenv>=0.9.9",
    "mutagen==1.47.0",
    "numpy>=2.5.1",
    "openwakeword>=0.4.0",
    "pillow>=12.3.0",
    "piper-tts>=1.6.0",
    "pystray>=0.19.5",
    "python-dotenv>=1.2.2",
    "scipy>=1.18.0",
    "sounddevice>=0.5.5",
    "speechbrain==0.5.14",
    "torchinfo==1.8.0",
    "torchmetrics==1.2.0",
    "tqdm>=4.70.0",
]

[project.scripts]
brixy = "brixy.main:run"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "brixy"
